<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPick - Panel Operador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar">
                <div class="position-sticky">
                    <div class="text-center mb-4">
                        <img src="img/SmartPick.png" alt="SmartPick" class="logo">
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="dashboard_operador.html">
                                <i class="bi bi-grid"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="inventario.html">
                                <i class="bi bi-boxes"></i> Inventario
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="perfil.html">
                                <i class="bi bi-person-circle"></i> Mi Perfil
                            </a>
                        </li>
                        <li class="nav-item mt-5">
                            <a class="nav-link" href="#" onclick="logout()">
                                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <!-- Topbar -->
                <div class="topbar d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 text-primary">
                        <i class="bi bi-person-badge"></i> Panel de Operador
                    </h4>
                    <div class="user-info">
                        <span id="userName" class="fw-bold text-dark">Operador</span>
                        <div class="user-avatar" id="userAvatar">
                            <i class="bi bi-person-fill"></i>
                        </div>
                    </div>
                </div>

                <!-- Stats -->
                <div class="row mt-4">
                    <div class="col-md-3">
                        <div class="card card-primary p-3">
                            <div class="stat-number" id="totalPedidos">0</div>
                            <div class="stat-label">Pedidos Totales</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-success p-3">
                            <div class="stat-number" id="pedidosCompletados">0</div>
                            <div class="stat-label">Pedidos Completados</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-danger p-3">
                            <div class="stat-number" id="pedidosPendientes">0</div>
                            <div class="stat-label">Pedidos Pendientes</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-warning p-3">
                            <div class="stat-number" id="productosEnZona">0</div>
                            <div class="stat-label">Productos en Zona</div>
                        </div>
                    </div>
                </div>

                <!-- Recent Orders -->
                <div class="row mt-4">
                    <div class="col-12">
                        <div class="card p-3">
                            <h5 class="mb-3">
                                <i class="bi bi-clock-history text-primary"></i> 
                                Pedidos Recientes
                            </h5>
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>ID Pedido</th>
                                            <th>Cliente</th>
                                            <th>Fecha Ingreso</th>
                                            <th>Estado</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="recentOrders">
                                        <!-- Datos cargados desde JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
