<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SmartPick - Contacto">
  <title>SmartPick | Contáctanos</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/contacto.css">

</head>

<body>

  <div class="site-shell">

    <!-- HEADER -->
    <header class="topbar">
      <div class="container-fluid px-3 px-md-4">
        <div class="d-flex align-items-center justify-content-between">

          <a href="index.html" class="brand" aria-label="SmartPick inicio">
            <img src="img/SmartPick.png" height="100" width="100">
          </a>

          <button class="menu-button" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu"
            aria-controls="mainMenu" aria-expanded="false" aria-label="Abrir menú">
            <span></span><span></span><span></span>
          </button>

        </div>

        <div class="collapse" id="mainMenu">
          <nav class="mobile-menu">
            <a href="index.html">INICIO</a>
            <a href="proyecto">SOBRE NOSOTROS</a>
            <a href="funcionalidades">FUNCIONALIDADES</a>
            <a href="galeria">GALERÍA</a>
            <a href="#">CONTACTO</a>
          </nav>
        </div>
      </div>
    </header>

    <!-- HERO -->
    <section class="hero">
      <img src="img/hero.png" height="300" width="1180">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1>CONTACTANOS</h1>
      </div>
    </section>

    <!-- CONTACTO -->
    <section class="contact-section">
      <div class="container-fluid px-4 px-md-5">

        <div class="row g-4 g-lg-5">

          <!-- FORMULARIO -->
          <div class="col-lg-7">
            <form class="contact-form" action="#" method="post">

              <div class="field">
                <label for="nombre">Nombre*</label>
                <input id="nombre" name="nombre" type="text" required>
              </div>

              <div class="field">
                <label for="email">Email*</label>
                <input id="email" name="email" type="email" required>
              </div>

              <div class="field">
                <label for="telefono">Teléfono*</label>
                <input id="telefono" name="telefono" type="tel" required>
              </div>

              <div class="field">
                <label for="mensaje">Mensaje*</label>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
              </div>

              <button class="submit-btn" type="submit">
                ENVIAR
              </button>

            </form>
          </div>

          <!-- INFORMACIÓN -->
          <div class="col-lg-5">
            <div class="contact-info">

              <div class="socials">
                <a href="#" aria-label="Instagram" class="social instagram">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                    <circle cx="12" cy="12" r="4"></circle>
                    <circle cx="17.5" cy="6.5" r="1"></circle>
                  </svg>
                </a>

                <a href="#" aria-label="Facebook" class="social facebook">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path
                      d="M13.4 7.2h2V4.8c-.35-.05-1.55-.15-2.95-.15-2.92 0-4.92 1.78-4.92 5.06v2.82H4.3v2.68h3.23v6.72h3.92v-6.72h3.05l.48-2.68h-3.53V10c0-.78.21-1.31 1.95-1.31z">
                    </path>
                  </svg>
                </a>
              </div>

              <p class="company">Constant CO</p>

              <a class="email-link" href="mailto:constant.co2026@gmail.com">
                constant.co2026@gmail.com
              </a>

              <div class="map-placeholder">
                <span>mapa |<br>ubicacion</span>
              </div>

            </div>
          </div>

        </div>

      </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="container-fluid px-4 px-md-5">
        <div class="row align-items-center">
          <div class="col-md-4">
            <div class="footer-logo">
              <a href="index.html">
                <img src="img/SmartPick.png" height="120" width="170">
              </a>
            </div>
          </div>

          <div class="col-md-8">
            <div class="footer-links">
              <a href="index.html">Inicio</a>
              <a href="#">Sobre el proyecto</a>
              <a href="#">Funcionalidades</a>
              <a href="#">Galería</a>
              <a href="#">Contacto</a>
            </div>
          </div>
        </div>

      </div>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
