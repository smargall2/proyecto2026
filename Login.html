<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de picking asistido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>

    <!-- NAVBAR -->
   <nav class="navbar navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand ms-3" href="index.html">
            <img src="img/SmartPick.png" alt="SmartPick" class="logo">
        </a>
    </div>
</nav>

    <!-- HERO -->
    <section class="hero d-flex align-items-center">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-11">
                    <div class="col-lg-5 offset-lg-4">
                        <div class="login-card">
                            <h2 class="text-center mb-4 text-primary">
                                <i class="bi bi-person-circle"></i>
                                Iniciar Sesión
                            </h2>

                            <form id="loginForm">

                                <div class="mb-3">
                                    <label>Usuario</label>
                                    <input type="text" id="usuario" name="usuario" class="form-control" placeholder="Ingrese su usuario">
                                </div>

                                <div class="mb-4">
                                    <label>Contraseña</label>
                                    <input type="password"  id="password" name="password" class="form-control" placeholder="Ingrese su contraseña">
                                </div>

                                <div id="errorMsg" class="text-danger mb-3"></div>

                                <button type="submit" class="btn btn-login w-100">
                                    <i class="bi bi-box-arrow-in-right"></i>
                                    Ingresar
                                </button>

                                <button type="button" class="btn btn-login w-100 mt-3">
                                    <i class="bi bi-box-arrow-in-right"></i>
                                    Registrarse
                                </button>

                            </form>

                            <hr>

                            <div class="row text-center">
                                <div class="col"></div>
                                <div class="col"></div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </section>


    <!-- FOOTER -->
    <footer class="py-4">
        <div class="container text-center text-dark">

            <h5>
                Sistema de Gestión Logística
            </h5>

            <p>
                Proyecto 3º BT Tecnologías de la Información
            </p>

            <p>
                © 2026 Todos los derechos reservados.
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
