<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPick - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar">
                <div class="position-sticky">
                    <div class="text-center mb-4">
                        <img src="img/SmartPick.png" alt="SmartPick" class="logo">
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard_operador.html">
                                <i class="bi bi-grid"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="inventario.html">
                                <i class="bi bi-boxes"></i> Inventario
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="perfil.html">
                                <i class="bi bi-person-circle"></i> Mi Perfil
                            </a>
                        </li>
                        <li class="nav-item mt-5">
                            <a class="nav-link" href="#" onclick="logout()">
                                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <!-- Topbar -->
                <div class="topbar d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 text-primary">
                        <i class="bi bi-person-circle"></i> Mi Perfil
                    </h4>
                    <div class="user-info">
                        <span id="userName" class="fw-bold text-dark">Operador</span>
                        <div class="user-avatar" id="userAvatar">
                            <i class="bi bi-person-fill"></i>
                        </div>
                    </div>
                </div>

                <!-- Profile Content -->
                <div class="row mt-4">
                    <div class="col-lg-4">
                        <div class="card p-4 text-center">
                            <img src="" alt="Foto de perfil" class="profile-avatar mx-auto" id="profileImage">
                            <h5 class="mt-3" id="profileName">Nombre Operador</h5>
                            <p class="text-muted" id="profileRole">Rol</p>
                            <div class="upload-btn mt-3">
                                <button class="btn btn-teal w-100">
                                    <i class="bi bi-camera"></i> Cambiar Foto
                                </button>
                                <input type="file" accept="image/*" id="uploadPhoto">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-8">
                        <div class="card p-4">
                            <h5 class="mb-3">
                                <i class="bi bi-pencil-square text-primary"></i> 
                                Editar Perfil
                            </h5>
                            <form id="profileForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="fw-bold">CI</label>
                                        <input type="text" class="form-control" id="profileCI" readonly>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="fw-bold">Nombre Completo</label>
                                        <input type="text" class="form-control" id="profileFullName" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="fw-bold">Teléfono</label>
                                        <input type="text" class="form-control" id="profilePhone">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="fw-bold">Email</label>
                                        <input type="email" class="form-control" id="profileEmail" required>
                                    </div>
                                    <div class="col-12 mb-3">
                                        <label class="fw-bold">Dirección</label>
                                        <input type="text" class="form-control" id="profileAddress">
                                    </div>
                                    <div class="col-12">
                                        <button type="submit" class="btn btn-primary">
                                            <i class="bi bi-save"></i> Guardar Cambios
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
